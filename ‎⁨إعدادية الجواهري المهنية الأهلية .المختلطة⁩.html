<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>إعدادية الجواهري المهنية الأهلية المختلطة</title>
<style>
:root{--bg:#f3f5fa;--cd:#fff;--tx:#10203a;--mu:#5d6b85;--p:#14365f;--g:#c9a24a;--bd:#e0e6f1;--ok:#1a8f5a;--er:#c0392b;--in:#f7f9fd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1424;--cd:#13203a;--tx:#e8edf7;--mu:#9aa8c2;--p:#7fb0f0;--bd:#25354f;--in:#0e1a30;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b1424;--cd:#13203a;--tx:#e8edf7;--mu:#9aa8c2;--p:#7fb0f0;--bd:#25354f;--in:#0e1a30;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 Tahoma,"Segoe UI",system-ui,sans-serif}
header{background:linear-gradient(120deg,#0f2b4d,#1b4a7d);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{width:44px;height:44px;border-radius:50%;background:#fff}header b{flex:1;font-size:14px;line-height:1.3}
button,.b{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:8px 14px;background:var(--p);color:#fff}header button{background:#ffffff26;padding:6px 10px}
.b2{background:var(--in);color:var(--tx);border:1px solid var(--bd)}.bd{background:var(--er)}.sm{padding:4px 10px;font-size:13px}
main{max-width:1040px;margin:0 auto;padding:14px}.hero{border-radius:16px;overflow:hidden;position:relative;margin-bottom:14px}
.hero img{width:100%;height:230px;object-fit:cover;display:block}.hero div{position:absolute;inset:0;background:linear-gradient(0deg,#0a1f3acc,#0a1f3a22);color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:16px}
.hero h1{margin:0;font-size:22px}.hero p{margin:2px 0 0;opacity:.9}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}.c h3{margin:0 0 8px;color:var(--p);font-size:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}.s{background:var(--cd);border:1px solid var(--bd);border-top:3px solid var(--g);border-radius:12px;padding:12px;text-align:center}.s b{display:block;font-size:26px;color:var(--p)}.s span{color:var(--mu);font-size:13px}
input,select,textarea{font:inherit;width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);margin:3px 0}textarea{min-height:70px}
.r{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}label{font-size:13px;color:var(--mu)}
nav{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}nav button{background:var(--cd);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}nav .on{background:var(--p);color:#fff}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:right}th{color:var(--mu);font-weight:600}.td{background:#c9a24a22}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}.m{color:var(--mu);font-size:13px}.er{color:var(--er)}.ok{color:var(--ok)}
.chip{display:inline-block;background:var(--in);border:1px solid var(--bd);border-radius:20px;padding:2px 12px;margin:2px;font-size:13px}.warn{background:#c9a24a22;border:1px dashed var(--g);border-radius:10px;padding:8px 10px;font-size:13px}
@media(min-width:700px){.lg{max-width:420px;margin:0 auto}}
</style></head><body>

const n=nm($('#u').value),c=$('#p').value.trim(),h=await hc(n,c);let ok=null;
if(n===nm('الجواهري')){if(h===AH)ok={r:'a'}}else{const s=S.st.find(x=>nm(x.n)===n&&x.h===h);if(s)ok={r:'s',id:s.id}}
if(ok){me=ok;tab=ok.r==='a'?'d':'h';A.msg='';try{localStorage.removeItem('jw_lk')}catch(x){}return R()}
await new Promise(r=>setTimeout(r,700));lk.n++;if(lk.n>=5){lk={n:0,t:Date.now()+3e5}}try{localStorage.setItem('jw_lk',JSON.stringify(lk))}catch(x){}

const my=x=>x.dep==='الكل'||x.dep===s.dep,dy=new Date().getDay();let b='';

b=card('أهلاً '+esc(s.n),`<p class="m">القسم: ${esc(s.dep)} — الصف: ${esc(s.gr)}</p><p>${esc(d.d)}</p>`)+`<div class="g">${stat(s.ab.length,'إجمالي الغيابات')}${stat(ex,'بعذر')}${stat(s.ab.length-ex,'بدون عذر')}</div>`+

if(tab==='g')b=card('الدرجات',s.sc.map(x=>`<p>${esc(x.s)} <b>${esc(x.v)}</b>/100<span class="bar"><i style="width:${Math.min(100,+x.v||0)}%"></i></span></p>`).join('')||'<p class="m">لم تُسجَّل درجات بعد.</p>')

(A.out?card('الرموز الجديدة (تظهر مرة واحدة فقط)',`<div class="tw"><table>${A.out.map(o=>`<tr><td>${esc(o.n)}</td><td><b>${o.c}</b></td></tr>`).join('')}</table></div><button class="b2" onclick="csv('codes.csv',[['الاسم','الرمز'],...A.out.map(o=>[o.n,o.c])])">حفظ كملف</button>`):'')+
card('الطلاب ('+S.st.length+')',`<input placeholder="بحث..." oninput="flt(this.value)"><div class="tw"><table>${S.st.map(s=>`<tr class="rw"><td>${esc(s.n)}</td><td>${esc(s.dep)}</td><td>${esc(s.gr)}</td><td><button class="sm b2" onclick="rst('${s.id}')">رمز جديد</button> <button class="sm bd" onclick="del('st','${s.id}')">حذف</button></td></tr>`).join('')}</table></div>`)
if(tab==='a')b=card('تسجيل الغياب السريع',`<div class="r">${dsel}<input id="ad" type="date" value="${td()}"><input id="as" placeholder="المادة"></div><p class="m">علّم الغائبين فقط:</p><div class="tw"><table>${stu(A.dep).map(s=>`<tr><td>${esc(s.n)}</td><td><label><input type="checkbox" style="width:auto" id="a_${s.id}"> غائب</label></td><td><label><input type="checkbox" style="width:auto" id="x_${s.id}"> بعذر</label></td></tr>`).join('')||'<tr><td class="m">لا يوجد طلاب في هذا القسم.</td></tr>'}</table></div><button onclick="abs()">حفظ الغياب</button>`)
if(tab==='g')b=card('إدخال درجة',`<div class="r">${dsel}<select id="gs">${stu(A.dep).map(s=>`<option value="${s.id}">${esc(s.n)}</option>`).join('')}</select><input id="gj" placeholder="المادة"><input id="gv" type="number" min="0" max="100" placeholder="الدرجة من 100"></div><button onclick="grd()">حفظ</button>`)
if(tab==='t')b=card('جدول القسم',`${dsel}<p class="m">اكتب حصة في كل سطر بالترتيب لكل يوم</p><div class="r">${DAYS.map((d,i)=>`<div><label>${d}</label><textarea id="d${i}">${esc(((S.sch[A.dep]||[])[i]||[]).join('\n'))}</textarea></div>`).join('')}</div><button onclick="S.sch[A.dep]=DAYS.map((_,i)=>$('#d'+i).value.split('\n').map(x=>x.trim()).filter(Boolean));log('تحديث جدول '+A.dep);put();R()">حفظ الجدول</button>`)
if(tab==='e')b=card('امتحان جديد',`<div class="r"><select id="ed">${opt(all)}</select><input id="es" placeholder="المادة"><input id="et" type="date"></div><button onclick="addE()">إضافة</button>${S.ex.map(x=>`<p>${esc(x.dep)} — ${esc(x.s)} — ${esc(x.d)} <button class="sm bd" onclick="del('ex','${x.id}')">حذف</button></p>`).join('')}`)+
card('واجب جديد',`<div class="r"><select id="hd">${opt(all)}</select><input id="hs" placeholder="المادة"><input id="ht" placeholder="الواجب"><input id="hu" type="date"></div><button onclick="addH()">إضافة</button>${S.hw.map(x=>`<p>${esc(x.dep)} — ${esc(x.s)}: ${esc(x.t)} <button class="sm bd" onclick="del('hw','${x.id}')">حذف</button></p>`).join('')}`)
if(tab==='n')b=card('نشر مستجد',`<input id="nt" placeholder="العنوان"><textarea id="nb" placeholder="النص"></textarea><button onclick="S.news.unshift({id:uid(),t:$('#nt').value,b:$('#nb').value,d:td()});log('نشر مستجد');put();R()">نشر</button>`)+S.news.map(x=>card(esc(x.t),`<p class="m">${esc(x.d)}</p><button class="sm bd" onclick="del('news','${x.id}')">حذف</button>`)).join('')
if(tab==='m')b=card('صفحة الملخصات',`<p>الحالة: <b class="${S.set.sumOn?'ok':'er'}">${S.set.sumOn?'ظاهرة للطلاب':'مخفية'}</b></p><button onclick="S.set.sumOn=!S.set.sumOn;put();R()">${S.set.sumOn?'إخفاء الصفحة':'إظهار الصفحة'}</button>`)+
card('إضافة ملخص',`<div class="r"><select id="sd">${opt(all)}</select><input id="ss" placeholder="المادة"><input id="sc" placeholder="اسم المدرّس"></div><input id="st" placeholder="العنوان"><textarea id="sb" placeholder="نص الملخص"></textarea><button onclick="S.sum.unshift({id:uid(),dep:$('#sd').value,s:$('#ss').value,tc:$('#sc').value,t:$('#st').value,b:$('#sb').value,on:true});log('إضافة ملخص');put();R()">نشر</button>`)+
S.sum.map(x=>card(esc(x.t),`<p class="m">${esc(x.dep)} — ${esc(x.s)} — ${esc(x.tc)}</p><button class="sm b2" onclick="tg('${x.id}')">${x.on?'إخفاء':'إظهار'}</button> <button class="sm bd" onclick="del('sum','${x.id}')">حذف</button>`)).join('')
if(tab==='x')b=card('بيانات التواصل',`<input id="sp" placeholder="الهاتف" value="${esc(S.set.ph)}"><input id="sa" placeholder="العنوان" value="${esc(S.set.ad)}"><input id="sm" placeholder="البريد" value="${esc(S.set.ml)}"><button onclick="S.set.ph=$('#sp').value;S.set.ad=$('#sa').value;S.set.ml=$('#sm').value;put();R()">حفظ</button>`)+
card('الأقسام',`<p class="m">سطر لكل قسم: الاسم | الوصف</p><textarea id="dp">${esc(S.dep.map(d=>d.n+' | '+d.d).join('\n'))}</textarea><button onclick="S.dep=$('#dp').value.split('\n').filter(x=>x.trim()).map(l=>{const p=l.split('|');return{n:p[0].trim(),d:(p[1]||'').trim()}});put();R()">حفظ الأقسام</button>`)+
card('تقارير',`<button class="b2" onclick="csv('absences.csv',[['الاسم','القسم','التاريخ','المادة','عذر'],...S.st.flatMap(s=>s.ab.map(a=>[s.n,s.dep,a.d,a.s,a.x?'نعم':'لا']))])">تصدير الغيابات</button> <button class="b2" onclick="csv('grades.csv',[['الاسم','القسم','المادة','الدرجة'],...S.st.flatMap(s=>s.sc.map(a=>[s.n,s.dep,a.s,a.v]))])">تصدير الدرجات</button>`)
return tabs(T)+b}
const flt=v=>document.querySelectorAll('.rw').forEach(r=>r.hidden=!nm(r.textContent).includes(nm(v)));
function del(k,id){if(!confirm('تأكيد الحذف؟'))return;S[k]=S[k].filter(x=>x.id!==id);log('حذف من '+k);put();R()}
const tg=id=>{const x=S.sum.find(y=>y.id===id);x.on=!x.on;put();R()};
async function addS(){const n=$('#n1').value.trim();if(!n)return;const c=gen();S.st.push({id:uid(),n,dep:$('#d1').value,gr:$('#g1').value.trim(),h:await hc(n,c),ab:[],sc:[]});A.out=[{n,c}];log('إضافة طالب');put();R()}
async function imp(){A.out=[];for(const l of $('#im').value.split('\n')){const p=l.split(/[،,\t]/).map(x=>x.trim());if(!p[0])continue;const c=gen();S.st.push({id:uid(),n:p[0],dep:dn().includes(p[1])?p[1]:dn()[0],gr:p[2]||'',h:await hc(p[0],c),ab:[],sc:[]});A.out.push({n:p[0],c})}log('استيراد '+A.out.length+' طالب');put();R()}
async function rst(id){const s=S.st.find(x=>x.id===id),c=gen();s.h=await hc(s.n,c);A.out=[{n:s.n,c}];log('رمز جديد');put();R()}
function abs(){const d=$('#ad').value,m=$('#as').value;let k=0;stu(A.dep).forEach(s=>{if($('#a_'+s.id).checked){s.ab.push({d,s:m,x:$('#x_'+s.id).checked?1:0});k++}});log('غياب '+k+' طالب');put();R()}
function grd(){const s=S.st.find(x=>x.id===$('#gs').value);if(!s||$('#gv').value==='')return;s.sc.push({s:$('#gj').value,v:+$('#gv').value});log('درجة '+s.n);put();R()}
function addE(){S.ex.push({id:uid(),dep:$('#ed').value,s:$('#es').value,d:$('#et').value});put();R()}
function addH(){S.hw.push({id:uid(),dep:$('#hd').value,s:$('#hs').value,t:$('#ht').value,d:$('#hu').value});put();R()}
async function csv(f,rows){let d=null;try{d=await claude.use('downloads')}catch(e){}const t='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n');if(!d){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/csv'}));a.download=f;a.click();return}try{await d.save({filename:f,data:t})}catch(e){}}
init()
</script></body></html>
